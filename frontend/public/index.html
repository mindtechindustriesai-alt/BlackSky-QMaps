<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackSky QMaps — Quantum 3D Mapping</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="logo">
                <h1>🌍 BlackSky QMaps</h1>
                <span class="quantum-badge">⚛️ CHSH S=2.76</span>
            </div>
            <div class="controls">
                <button onclick="toggleLanguage()">🌐 Languages</button>
                <button onclick="toggleQuantum()">⚛️ Quantum</button>
            </div>
        </header>
        
        <div id="map-container">
            <div id="map">Loading 3D Globe...</div>
        </div>
        
        <div class="quantum-overlay">
            <span class="status">🔒 Quantum-Secured</span>
            <span class="patent">SA 2026/05142</span>
        </div>
        
        <footer>
            <div class="footer-logos">
                <img src="assets/logos/mindtech.png" alt="MindTech">
                <img src="assets/logos/blacksky.png" alt="BlackSky">
            </div>
            <p>© 2026 MindTech Industries · Quantum-Sovereign African Tech</p>
        </footer>
    </div>
    
    <script src="js/quantum.js"></script>
    <script src="js/map.js"></script>
    <script src="js/language.js"></script>
    <script src="js/pelo.js"></script>
</body>
</html>
